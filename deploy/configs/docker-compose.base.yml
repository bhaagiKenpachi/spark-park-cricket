version: '3.8'

# Base Docker Compose configuration
# This file contains common configurations that can be extended by environment-specific files

services:
  # Redis Cache - Base Configuration
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Go Backend API - Base Configuration
  backend:
    build:
      context: ../../
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-network
    restart: unless-stopped
    environment:
      # Common environment variables
      - REDIS_URL=redis:6379
      - REDIS_DB=0
      - REDIS_USE_TLS=false
      - CACHE_ENABLED=true

  # Next.js Frontend - Base Configuration
  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-network
    restart: unless-stopped

  # Prometheus - Base Configuration
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network
    restart: unless-stopped

  # Loki - Base Configuration
  loki:
    image: grafana/loki:2.9.0
    volumes:
      - ../../monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network
    restart: unless-stopped

  # Promtail - Base Configuration
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ../../monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - cricket-network
    restart: unless-stopped

  # Grafana - Base Configuration
  grafana:
    image: grafana/grafana:10.2.0
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  cricket-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
