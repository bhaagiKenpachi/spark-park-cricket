version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cricket-redis-dev
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-dev-network
    restart: unless-stopped

  # Go Backend API
  backend:
    image: ${BACKEND_IMAGE:-spark-cricket-backend-dev}
    container_name: cricket-backend-dev
    ports:
      - "8081:8080"
    env_file:
      - .env.backend
    environment:
      # Database Configuration
      - DATABASE_SCHEMA=dev_v1
      # Redis Configuration
      - REDIS_URL=redis:6379
      - REDIS_DB=1
      - REDIS_USE_TLS=false
      - CACHE_ENABLED=true
      # Session Configuration
      # SESSION_SECRET should be set in .env.backend file for security
      - SESSION_MAX_AGE=86400
      # OAuth Configuration
      - GOOGLE_REDIRECT_URL=https://spark-park-dev.dojima.foundation/api/v1/auth/google/callback
      # CORS Configuration
      - ALLOWED_ORIGINS=https://spark-park-dev.dojima.foundation,http://139.99.73.135:3000,http://localhost:3000,http://localhost:3001,http://localhost:3002
      # Server Configuration
      - FRONTEND_URL=https://spark-park-dev.dojima.foundation
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-dev-network
    restart: unless-stopped
    # volumes:
    # Mount source code for hot reload in development
    # - ../../../backend:/app/src:ro

    # Next.js Frontend
  web:
    image: ${WEB_IMAGE:-spark-cricket-frontend-dev}
    container_name: cricket-frontend-dev
    ports:
      - "3001:3000"
    env_file:
      - .env.frontend
    environment:
      # Next.js Configuration
      - NODE_ENV=production
      - PORT=3000
      # API Configuration
      - NEXT_PUBLIC_API_URL=https://spark-park-dev.dojima.foundation/api/v1
      - NEXT_PUBLIC_GRAPHQL_URL=https://spark-park-dev.dojima.foundation/api/v1/graphql
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cricket-dev-network
    restart: unless-stopped
    # volumes:
    # Mount source code for hot reload in development
    # - ../../../web:/app:ro
    # - /app/node_modules
    # - /app/.next

    # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: cricket-prometheus-dev
    ports:
      - "9091:9090"
    volumes:
      - ../../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../../../monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_dev_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-dev-network
    restart: unless-stopped

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: cricket-loki-dev
    ports:
      - "3101:3100"
    volumes:
      - ../../../monitoring/loki/loki.yml:/etc/loki/local-config.yaml
      - loki_dev_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-dev-network
    restart: unless-stopped

  # Promtail - Log Collection
  promtail:
    image: grafana/promtail:2.9.0
    container_name: cricket-promtail-dev
    volumes:
      - ../../../monitoring/promtail/promtail.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - cricket-dev-network
    restart: unless-stopped

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: cricket-grafana-dev
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ../../../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ../../../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-dev-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cricket-nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../configs/nginx-dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "test -f /var/run/nginx.pid || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-dev-network
    restart: unless-stopped

volumes:
  redis_dev_data:
    driver: local
  prometheus_dev_data:
    driver: local
  grafana_dev_data:
    driver: local
  loki_dev_data:
    driver: local

networks:
  cricket-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
