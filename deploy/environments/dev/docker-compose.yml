version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cricket-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network
    restart: unless-stopped

  # Go Backend API
  backend:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    container_name: cricket-backend-dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Server Configuration
      - PORT=8080
      - ENV=development
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002

      # Redis Configuration
      - REDIS_URL=redis:6379
      - REDIS_DB=0
      - REDIS_USE_TLS=false
      - CACHE_ENABLED=true

      # OAuth Configuration
      - GOOGLE_REDIRECT_URL=http://localhost:8080/api/v1/auth/google/callback

      # Session Configuration
      - SESSION_MAX_AGE=86400

      # Development specific
      - LOG_LEVEL=debug
      - DEBUG=true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-network
    restart: unless-stopped
    volumes:
      # Mount source code for hot reload in development
      - ../../../backend:/app/src:ro

  # Next.js Frontend
  web:
    build:
      context: ../../../web
      dockerfile: Dockerfile
    container_name: cricket-frontend-dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Next.js Configuration
      - NODE_ENV=development
      - PORT=3000
      # API Configuration - Use localhost for browser access
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - NEXT_PUBLIC_GRAPHQL_URL=http://localhost:8080/api/v1/graphql
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-network
    restart: unless-stopped
    volumes:
      # Mount source code for hot reload in development
      - ../../../web:/app:ro
      - /app/node_modules
      - /app/.next

volumes:
  redis_data:
    driver: local

networks:
  cricket-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
