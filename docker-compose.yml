# ========================================================================
# DOCKER COMPOSE CONFIGURATION - CRITICAL ENVIRONMENT SETUP NOTES
# ========================================================================
#
# IMPORTANT: How to Avoid Common Environment Variable Mistakes
# ========================================================================
#
# 1. NEVER HARDCODE VALUES IN DOCKERFILES
#    - DON'T: ARG NEXT_PUBLIC_API_URL=https://hardcoded-domain.com
#    - DO: ARG NEXT_PUBLIC_API_URL (no default, comes from env)
#
# 2. UNDERSTAND BUILD-TIME vs RUNTIME ENVIRONMENT VARIABLES
#    - Next.js NEXT_PUBLIC_* vars are BAKED INTO BUILD at compile time
#    - Changing .env and restarting container WON'T update these values
#    - You MUST rebuild: docker compose build --no-cache web
#
# 3. ENVIRONMENT VARIABLE SOURCES (priority order):
#    a. Shell environment variables (highest priority)
#    b. .env file in service directory (e.g., backend/.env, web/.env)
#    c. docker-compose.yml "environment" section
#    d. Dockerfile ARG defaults (should be avoided!)
#
# 4. PASSING VARIABLES TO DOCKER BUILD
#    - Use "build.args" in docker-compose.yml
#    - Reference env vars: ${VARIABLE_NAME} (not hardcoded values)
#    - Set them in .env files or shell before: docker compose build
#
# 5. WHEN TO REBUILD vs RESTART
#    - RESTART (docker compose restart): Runtime env changes only
#    - REBUILD (docker compose build): Any NEXT_PUBLIC_*, Dockerfile, or code changes
#    - NUCLEAR (docker compose down -v && docker compose up -d --build): When in doubt
#
# 6. CHECKING WHAT'S IN THE BUILD
#    - Check container env: docker exec <container> env
#    - Check build output: docker exec <container> grep -r "your-domain" .next/
#    - Verify no hardcoded domains remain in built files
#
# 7. BROWSER CACHE ISSUES
#    - Docker containers can be perfect, but browser caches old JS
#    - Always test in Incognito OR hard refresh (Cmd+Shift+R)
#    - Old cached JS will use old API URLs even with new containers
#
# ========================================================================

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cricket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network

  # Go Backend API
  # ========================================================================
  # BACKEND SERVICE CONFIGURATION
  # ========================================================================
  # - Primary config comes from: backend/.env
  # - Docker overrides below are for container-specific values (Redis hostname, etc.)
  # - ALL sensitive values (Google OAuth, Supabase, etc.) should be in backend/.env
  # - To apply backend/.env changes: docker compose restart backend
  # ========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cricket-backend-dev
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env # Main configuration source
    environment:
      # Server Configuration (container-specific overrides)
      - PORT=8080
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002

      # Redis Configuration (using Docker service name 'redis')
      - REDIS_URL=redis:6379
      - REDIS_DB=0
      - REDIS_USE_TLS=false
      - CACHE_ENABLED=true

      # Session Configuration
      - SESSION_MAX_AGE=86400
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-network

  # Next.js Frontend
  # ========================================================================
  # FRONTEND SERVICE CONFIGURATION - CRITICAL BUILD-TIME NOTES
  # ========================================================================
  #
  # ⚠️  CRITICAL: Next.js NEXT_PUBLIC_* variables are BAKED AT BUILD TIME
  #
  # What this means:
  # - NEXT_PUBLIC_* vars are compiled into JavaScript during "npm run build"
  # - They become STATIC strings in the .next/ build output
  # - Changing .env and restarting will NOT update them
  # - You MUST rebuild to pick up changes
  #
  # Configuration sources (in order):
  # 1. web/.env - Primary source for all NEXT_PUBLIC_* variables
  # 2. "build.args" below - Pass web/.env values to Docker build
  # 3. "env_file" below - Sets runtime environment (less important for NEXT_PUBLIC_*)
  #
  # How to update NEXT_PUBLIC_* variables:
  # 1. Edit web/.env
  # 2. Rebuild: docker compose build --no-cache web
  # 3. Restart: docker compose up -d web
  # 4. Clear browser cache or use Incognito to test
  #
  # Common mistakes to avoid:
  # - ❌ Hardcoding domains in Dockerfile ARG defaults
  # - ❌ Using fallback values in code (process.env.VAR || 'hardcoded')
  # - ❌ Expecting restart to pick up NEXT_PUBLIC_* changes
  # - ❌ Forgetting to clear browser cache after rebuild
  # - ✅ Always use env vars with no defaults: process.env.VAR!
  # - ✅ Always rebuild after changing NEXT_PUBLIC_* vars
  # - ✅ Test in Incognito to avoid browser cache issues
  #
  # ========================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Build arguments - passed to Docker build from web/.env
        # These are used during "npm run build" to bake values into JavaScript
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_GRAPHQL_URL=${NEXT_PUBLIC_GRAPHQL_URL}
        - NEXT_PUBLIC_ADSENSE_CLIENT_ID=${NEXT_PUBLIC_ADSENSE_CLIENT_ID}
        - NEXT_PUBLIC_ENABLE_ADS=${NEXT_PUBLIC_ENABLE_ADS}
        - NODE_ENV=production # Always use production for Docker builds
    container_name: cricket-frontend-dev
    env_file:
      - ./web/.env # Runtime environment (also source for ${} references above)
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-network
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: cricket-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: cricket-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network

  # Promtail - Log Collection
  promtail:
    image: grafana/promtail:2.9.0
    container_name: cricket-promtail
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - cricket-network

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: cricket-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cricket-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/configs/nginx-dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "test -f /var/run/nginx.pid || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  cricket-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
