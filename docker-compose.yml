services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cricket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cricket-backend-dev
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      # Server Configuration
      - PORT=8080
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002

      # Redis Configuration
      - REDIS_URL=redis:6379
      - REDIS_DB=0
      - REDIS_USE_TLS=false
      - CACHE_ENABLED=true

      # OAuth Configuration
      - GOOGLE_REDIRECT_URL=http://localhost:8080/api/v1/auth/google/callback

      # Session Configuration
      - SESSION_MAX_AGE=86400
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-network

  # Next.js Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cricket-frontend-dev
    ports:
      - "3000:3000"
    environment:
      # Next.js Configuration
      - NODE_ENV=development
      - PORT=3000
      # API Configuration - Use localhost for local development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - NEXT_PUBLIC_GRAPHQL_URL=http://localhost:8080/api/v1/graphql
      # PostHog Configuration - PostHog Cloud
      - NEXT_PUBLIC_POSTHOG_KEY=${POSTHOG_KEY:-phc_91Oi5cxrr7HPQXzP8hrYJ8oOxvdOQ5XmmGxAsbQ7OaV}
      - NEXT_PUBLIC_POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
      - NEXT_PUBLIC_POSTHOG_DEBUG=true
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-network
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: cricket-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: cricket-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network

  # Promtail - Log Collection
  promtail:
    image: grafana/promtail:2.9.0
    container_name: cricket-promtail
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - cricket-network

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: cricket-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network

  # ========================================================================
  # PostHog Self-Hosted Services
  # ========================================================================

  # PostgreSQL for PostHog
  posthog-db:
    image: postgres:14-alpine
    container_name: cricket-posthog-db
    environment:
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: posthog
      POSTGRES_DB: posthog
    volumes:
      - posthog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U posthog" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network

  # ClickHouse for PostHog analytics
  posthog-clickhouse:
    image: clickhouse/clickhouse-server:23.11
    container_name: cricket-posthog-clickhouse
    volumes:
      - posthog_clickhouse_data:/var/lib/clickhouse
      - ./monitoring/clickhouse/listen-ipv4.xml:/etc/clickhouse-server/config.d/listen-ipv4.xml:ro
    environment:
      CLICKHOUSE_DB: posthog
      CLICKHOUSE_USER: posthog
      CLICKHOUSE_PASSWORD: posthog
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--query", "SELECT 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network

  # Redis for PostHog (separate from app redis)
  posthog-redis:
    image: redis:7-alpine
    container_name: cricket-posthog-redis
    volumes:
      - posthog_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cricket-network

  # PostHog Web Service
  posthog:
    image: posthog/posthog:latest
    container_name: cricket-posthog
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgres://posthog:posthog@posthog-db:5432/posthog
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_USER: posthog
      CLICKHOUSE_PASSWORD: posthog
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
      REDIS_URL: redis://posthog-redis:6379/
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-posthog-dev-secret-key-change-in-production}
      SITE_URL: http://localhost:8001
      DISABLE_SECURE_SSL_REDIRECT: 'true'
      IS_BEHIND_PROXY: 'true'
      TRUST_ALL_PROXIES: 'true'
      SKIP_ASYNC_MIGRATIONS_SETUP: 'true'
      SKIP_SERVICE_VERSION_REQUIREMENTS: 'true'
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/_health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cricket-network

  # PostHog Worker for background tasks
  posthog-worker:
    image: posthog/posthog:latest
    container_name: cricket-posthog-worker
    command: ./bin/docker-worker-celery --with-scheduler
    environment:
      DATABASE_URL: postgres://posthog:posthog@posthog-db:5432/posthog
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_USER: posthog
      CLICKHOUSE_PASSWORD: posthog
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
      REDIS_URL: redis://posthog-redis:6379/
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-posthog-dev-secret-key-change-in-production}
      SITE_URL: http://localhost:8001
      SKIP_ASYNC_MIGRATIONS_SETUP: 'true'
      SKIP_SERVICE_VERSION_REQUIREMENTS: 'true'
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
    networks:
      - cricket-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cricket-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/configs/nginx-dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "test -f /var/run/nginx.pid || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cricket-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  posthog_postgres_data:
    driver: local
  posthog_clickhouse_data:
    driver: local
  posthog_redis_data:
    driver: local

networks:
  cricket-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
