groups:
  - name: cricket-backend-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds"

      - alert: BallAPISlow
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{endpoint="/api/v1/scorecard/ball"}[5m])) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ball API is slow"
          description: "Ball API 95th percentile response time is {{ $value }} seconds"

      - alert: BallAPIDatabaseSlow
        expr: histogram_quantile(0.95, rate(ball_api_database_duration_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Ball API database operations are slow"
          description: "Ball API database 95th percentile duration is {{ $value }} seconds"

      - alert: BallAPIDatabaseErrors
        expr: rate(ball_api_database_operations_total{status="error"}[5m]) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ball API database errors detected"
          description: "Ball API database error rate is {{ $value }} errors per second"

      - alert: DatabaseConnectionFailure
        expr: up{job="cricket-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend service is down"
          description: "Cricket backend service is not responding"

      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }} MB"

      - alert: RedisConnectionFailure
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis cache service is not responding"

  - name: cricket-frontend-alerts
    rules:
      - alert: FrontendDown
        expr: up{job="cricket-frontend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Frontend is down"
          description: "Cricket frontend service is not responding"

      - alert: HighFrontendErrorRate
        expr: rate(http_requests_total{job="cricket-frontend",status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High frontend error rate"
          description: "Frontend error rate is {{ $value }} errors per second"
