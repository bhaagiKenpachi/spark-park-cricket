global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'local'
    cluster: 'cricket-local'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Local backend metrics
  - job_name: 'cricket-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Local Redis metrics (if available)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 15s
    scrape_timeout: 10s

# Remote write configuration to send metrics to VM Prometheus
remote_write:
  - url: "http://51.79.143.135:9090/api/v1/write"
    queue_config:
      max_samples_per_send: 1000
      batch_send_deadline: 5s