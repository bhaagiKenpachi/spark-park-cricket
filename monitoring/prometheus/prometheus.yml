global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'local'
    cluster: 'cricket-local-cluster'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Local backend metrics
  - job_name: 'cricket-backend'
    static_configs:
      - targets: ['cricket-backend:8080']
    metrics_path: '/metrics'
    scheme: 'http'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Local frontend metrics (if available)
  - job_name: 'cricket-frontend'
    static_configs:
      - targets: ['cricket-frontend:3000']
    metrics_path: '/api/metrics'
    scheme: 'http'
    scrape_interval: 30s
    scrape_timeout: 10s

# Alerting rules
rule_files:
  - "rules/*.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
