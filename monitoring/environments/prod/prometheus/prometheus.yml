global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'prod'
    cluster: 'cricket-prod-cluster'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Production backend metrics - Using container name in Docker network
  - job_name: 'cricket-backend-prod'
    static_configs:
      - targets: ['cricket-backend-prod:8080']
    metrics_path: '/metrics'
    scheme: 'http'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Production frontend metrics (if available) - Using container name in Docker network
  - job_name: 'cricket-frontend-prod'
    static_configs:
      - targets: ['cricket-frontend-prod:3000']
    metrics_path: '/api/metrics'
    scheme: 'http'
    scrape_interval: 30s
    scrape_timeout: 10s

# Remote write configuration to send metrics to central Prometheus (optional)
# remote_write:
#   - url: "http://central-prometheus:9090/api/v1/write"
#     queue_config:
#       max_samples_per_send: 1000
#       batch_send_deadline: 5s

# Alerting rules
rule_files:
  - "rules/*.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
