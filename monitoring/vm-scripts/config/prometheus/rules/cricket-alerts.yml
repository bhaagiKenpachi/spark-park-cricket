groups:
  - name: cricket-system-alerts
    rules:
      # High CPU Usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for more than 5 minutes on {{ $labels.instance }}"

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes * 100) < 10
        for: 5m
        labels:
          severity: critical
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "Disk space is low"
          description: "Disk space is below 10% on {{ $labels.instance }} mount {{ $labels.mountpoint }}"

      # Service Down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "Service is down"
          description: "{{ $labels.job }} service is down on {{ $labels.instance }}"

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 5m
        labels:
          severity: critical
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for {{ $labels.job }} service"

      # Database Connection Issues
      - alert: DatabaseConnectionFailed
        expr: increase(database_connection_errors_total[5m]) > 10
        for: 2m
        labels:
          severity: critical
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "Database connection failures"
          description: "High number of database connection failures detected for {{ $labels.job }}"

      # High Response Time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is above 2 seconds for {{ $labels.job }}"

      # Container Restart
      - alert: ContainerRestart
        expr: increase(container_start_time_seconds[10m]) > 0
        for: 0m
        labels:
          severity: warning
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "Container restarted"
          description: "Container {{ $labels.name }} has restarted"

      # Prometheus Target Down
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "Prometheus target is down"
          description: "Prometheus target {{ $labels.job }} is down on {{ $labels.instance }}"

  - name: cricket-application-alerts
    rules:
      # Application Health Check
      - alert: ApplicationHealthCheckFailed
        expr: cricket_health_check_status == 0
        for: 2m
        labels:
          severity: critical
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "Application health check failed"
          description: "Health check failed for cricket application on {{ $labels.instance }}"

      # Match Processing Errors
      - alert: MatchProcessingErrors
        expr: rate(cricket_match_processing_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "High match processing error rate"
          description: "Match processing error rate is high for {{ $labels.job }}"

      # Scoreboard Update Failures
      - alert: ScoreboardUpdateFailures
        expr: rate(cricket_scoreboard_update_failures_total[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "Scoreboard update failures"
          description: "High rate of scoreboard update failures detected"

      # WebSocket Connection Issues
      - alert: WebSocketConnectionIssues
        expr: rate(cricket_websocket_connection_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          environment: '${ENVIRONMENT:-dev}'
        annotations:
          summary: "WebSocket connection issues"
          description: "High rate of WebSocket connection errors detected"
