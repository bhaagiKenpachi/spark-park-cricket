global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'dev'
    cluster: 'cricket-cluster'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Local backend metrics (from your machine)
  - job_name: 'cricket-backend'
    static_configs:
      - targets: ['172.20.10.11:8080']  # Your local machine IP
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
