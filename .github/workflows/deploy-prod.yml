name: Deploy to Production VM

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip building images (use existing images)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-prod.yml'
  # Trigger only on workflow file changes to make it visible
  # Remove this trigger after first appearance for manual-only deployments

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: [self-hosted, ovh, ubuntu-22.04]
    if: ${{ github.event.inputs.skip_build != 'true' }}
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image names
        id: image-name
        run: |
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}/cricket-backend" >> $GITHUB_OUTPUT
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}/cricket-web" >> $GITHUB_OUTPUT

      - name: Verify Docker environment
        run: |
          echo "🐳 Verifying Docker environment..."
          echo "Docker version: $(docker --version)"
          echo "Docker Compose version: $(docker compose version)"
          echo "✅ Docker environment ready!"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Backend Docker image
        run: |
          cd backend
          echo "🔨 Building backend Docker image..."
          
          # Build image with multiple tags
          docker build \
            --file Dockerfile \
            --tag ${{ steps.image-name.outputs.backend }}:prod \
            --tag ${{ steps.image-name.outputs.backend }}:prod-$(git rev-parse --short HEAD) \
            --tag ${{ steps.image-name.outputs.backend }}:latest \
            .
          
          echo "📤 Pushing backend images to GHCR..."
          docker push ${{ steps.image-name.outputs.backend }}:prod
          docker push ${{ steps.image-name.outputs.backend }}:prod-$(git rev-parse --short HEAD)
          docker push ${{ steps.image-name.outputs.backend }}:latest
          
          echo "✅ Backend image built and pushed successfully!"

      - name: Clean up Docker
        if: always()
        run: |
          echo "🧹 Cleaning up Docker resources..."
          docker system prune -f || true
          echo "✅ Cleanup completed"

  build-web:
    name: Build Web Image
    environment: prod
    runs-on: [self-hosted, ovh, ubuntu-22.04]
    needs: build-backend
    if: ${{ github.event.inputs.skip_build != 'true' }}
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image names
        id: image-name
        run: |
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}/cricket-backend" >> $GITHUB_OUTPUT
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}/cricket-web" >> $GITHUB_OUTPUT

      - name: Verify Docker environment
        run: |
          echo "🐳 Verifying Docker environment..."
          echo "Docker version: $(docker --version)"
          echo "Docker Compose version: $(docker compose version)"
          echo "✅ Docker environment ready!"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Web Docker image
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          cd web
          echo "🔨 Building web Docker image for PRODUCTION..."
          echo "📝 Using frontend URL: ${FRONTEND_URL}"
          echo "📝 API URL: ${FRONTEND_URL}/api/v1"
          echo "📝 GraphQL URL: ${FRONTEND_URL}/api/v1/graphql"
          
          # Build image with build args for Next.js public variables
          docker build \
            --file Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=${FRONTEND_URL}/api/v1 \
            --build-arg NEXT_PUBLIC_GRAPHQL_URL=${FRONTEND_URL}/api/v1/graphql \
            --build-arg NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }} \
            --build-arg NEXT_PUBLIC_ENABLE_ADS=${{ secrets.NEXT_PUBLIC_ENABLE_ADS }} \
            --build-arg NEXT_PUBLIC_SSE_BALL_EVENT_TIMEOUT=${{ secrets.NEXT_PUBLIC_SSE_BALL_EVENT_TIMEOUT }} \
            --build-arg NEXT_PUBLIC_SSE_INACTIVITY_WARNING_THRESHOLD=${{ secrets.NEXT_PUBLIC_SSE_INACTIVITY_WARNING_THRESHOLD }} \
            --build-arg NEXT_PUBLIC_SSE_INACTIVITY_DISCONNECT_THRESHOLD=${{ secrets.NEXT_PUBLIC_SSE_INACTIVITY_DISCONNECT_THRESHOLD }} \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.POSTHOG_KEY }} \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.POSTHOG_HOST }} \
            --build-arg NEXT_PUBLIC_POSTHOG_DEBUG=false \
            --build-arg NODE_ENV=production \
            --tag ${{ steps.image-name.outputs.web }}:prod \
            --tag ${{ steps.image-name.outputs.web }}:prod-$(git rev-parse --short HEAD) \
            --tag ${{ steps.image-name.outputs.web }}:latest \
            .
          
          echo "📤 Pushing web images to GHCR..."
          docker push ${{ steps.image-name.outputs.web }}:prod
          docker push ${{ steps.image-name.outputs.web }}:prod-$(git rev-parse --short HEAD)
          docker push ${{ steps.image-name.outputs.web }}:latest
          
          echo "✅ Web image built and pushed successfully!"

      - name: Clean up Docker
        if: always()
        run: |
          echo "🧹 Cleaning up Docker resources..."
          docker system prune -f || true
          echo "✅ Cleanup completed"

  deploy:
    name: Deploy to Production VM
    environment: prod
    runs-on: [self-hosted, ovh, ubuntu-22.04]
    needs: [build-backend, build-web]
    if: ${{ always() && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') && (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image names
        id: image-name
        run: |
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}/cricket-backend" >> $GITHUB_OUTPUT
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}/cricket-web" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory on VM
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_VM_USER }}@${{ secrets.PROD_VM_HOST }} << 'EOF'
            mkdir -p ~/cricket-deployment
          EOF

      - name: Copy configuration files to VM
        run: |
          # Copy deploy directory structure
          scp -i ~/.ssh/deploy_key -r deploy ${{ secrets.PROD_VM_USER }}@${{ secrets.PROD_VM_HOST }}:~/cricket-deployment/
          
          # Copy monitoring configurations
          scp -i ~/.ssh/deploy_key -r monitoring ${{ secrets.PROD_VM_USER }}@${{ secrets.PROD_VM_HOST }}:~/cricket-deployment/

      - name: Create environment files on VM
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_VM_USER }}@${{ secrets.PROD_VM_HOST }} << 'EOF'
            cd ~/cricket-deployment/deploy/environments/prod
            
            # Create backend .env file
            cat > .env.backend << 'ENVFILE'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY=${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URL=${{ secrets.GOOGLE_REDIRECT_URL }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          PORT=8080
          REDIS_URL=redis:6379
          REDIS_DB=0
          REDIS_USE_TLS=false
          CACHE_ENABLED=true
          SESSION_MAX_AGE=86400
          ENVIRONMENT=prod
          DATABASE_SCHEMA=prod_v1
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
          LOG_LEVEL=info
          DEBUG=false
          SSE_CONNECTION_TIMEOUT=${{ secrets.SSE_CONNECTION_TIMEOUT }}
          SSE_HEARTBEAT_INTERVAL=${{ secrets.SSE_HEARTBEAT_INTERVAL }}
          ENVFILE

            # Create frontend .env file
            cat > .env.frontend << 'ENVFILE'
          NODE_ENV=production
          NEXT_PUBLIC_API_URL=${{ secrets.FRONTEND_URL }}/api/v1
          NEXT_PUBLIC_GRAPHQL_URL=${{ secrets.FRONTEND_URL }}/api/v1/graphql
          NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
          NEXT_PUBLIC_ENABLE_ADS=${{ secrets.NEXT_PUBLIC_ENABLE_ADS }}
          NEXT_PUBLIC_SSE_BALL_EVENT_TIMEOUT=${{ secrets.NEXT_PUBLIC_SSE_BALL_EVENT_TIMEOUT }}
          NEXT_PUBLIC_SSE_INACTIVITY_WARNING_THRESHOLD=${{ secrets.NEXT_PUBLIC_SSE_INACTIVITY_WARNING_THRESHOLD }}
          NEXT_PUBLIC_SSE_INACTIVITY_DISCONNECT_THRESHOLD=${{ secrets.NEXT_PUBLIC_SSE_INACTIVITY_DISCONNECT_THRESHOLD }}
          NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_DEBUG=false
          ENVFILE

            # Create docker-compose .env file for image references
            cat > .env << 'ENVFILE'
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
          BACKEND_IMAGE=${{ steps.image-name.outputs.backend }}:prod
          WEB_IMAGE=${{ steps.image-name.outputs.web }}:prod
          ENVFILE
          EOF

      - name: Login to GHCR on VM and pull images
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_VM_USER }}@${{ secrets.PROD_VM_HOST }} << EOF
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ steps.image-name.outputs.backend }}:prod
            docker pull ${{ steps.image-name.outputs.web }}:prod
            
            # Tag images for local reference
            docker tag ${{ steps.image-name.outputs.backend }}:prod spark-cricket-backend-prod
            docker tag ${{ steps.image-name.outputs.web }}:prod spark-cricket-frontend-prod
          EOF

      - name: Deploy services with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_VM_USER }}@${{ secrets.PROD_VM_HOST }} << 'EOF'
            cd ~/cricket-deployment/deploy/environments/prod
            
            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            docker compose down || true
            
            # Stop any container using port 80
            echo "🔍 Checking for processes on port 80..."
            NGINX_CONTAINER=$(docker ps -q -f "publish=80")
            if [ ! -z "$NGINX_CONTAINER" ]; then
              echo "Stopping container using port 80: $NGINX_CONTAINER"
              docker stop $NGINX_CONTAINER || true
              docker rm $NGINX_CONTAINER || true
            fi
            
            # Start all services
            echo "🚀 Starting all services..."
            docker compose up -d
          EOF

      - name: Wait for services to be healthy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_VM_USER }}@${{ secrets.PROD_VM_HOST }} << 'EOF'
            echo "Waiting for services to be healthy..."
            sleep 30
            
            # Check Redis
            docker exec cricket-redis-prod redis-cli ping || echo "Redis not ready"
            
            # Check backend health (using external port 8080)
            for i in {1..10}; do
              if curl -f http://localhost:8080/health; then
                echo "Backend is healthy"
                break
              fi
              echo "Waiting for backend... attempt $i/10"
              sleep 5
            done
            
            # Check web (using external port 3000)
            for i in {1..10}; do
              if curl -f http://localhost:3000; then
                echo "Web is healthy"
                break
              fi
              echo "Waiting for web... attempt $i/10"
              sleep 5
            done
          EOF

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_VM_USER }}@${{ secrets.PROD_VM_HOST }} << 'EOF'
            cd ~/cricket-deployment/deploy/environments/prod
            echo "=== Running Containers ==="
            docker ps
            echo ""
            echo "=== Container Health Status ==="
            docker compose ps
          EOF

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ PRODUCTION Deployment successful!"
          echo "🌐 Application URLs:"
          echo "  Backend API: http://${{ secrets.PROD_VM_HOST }}:8080"
          echo "  Frontend: http://${{ secrets.PROD_VM_HOST }}:3000"
          echo "  Nginx (Port 80): http://${{ secrets.PROD_VM_HOST }}"
          echo ""
          echo "📊 Monitoring URLs:"
          echo "  Grafana: http://${{ secrets.PROD_VM_HOST }}:3002"
          echo "  Prometheus: http://${{ secrets.PROD_VM_HOST }}:9090"
          echo "  Loki: http://${{ secrets.PROD_VM_HOST }}:3100"

